# Place at /etc/nginx/sites-available/caregiver and symlink into sites-enabled.
# Run: sudo certbot --nginx -d yourdomain.com   (after this file is enabled)

server {
    listen 80;
    server_name yourdomain.com;

    # Frontend static build (output of `npm run build` -> dist/)
    root /srv/caregiver-system/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
