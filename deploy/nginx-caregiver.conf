# Place at /etc/nginx/sites-available/caregiver and symlink into sites-enabled.
# Run: sudo certbot --nginx -d yourdomain.com   (after this file is enabled)

server {
    listen 80;
    server_name yourdomain.com;

    # Latest standalone public website.
    root /srv/caregiver-system/website;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Serve the React-built staff sign-in page at the public site's /employee-login URL.
    location = /employee-login {
        root /srv/caregiver-system/frontend/dist;
        try_files /index.html =404;
    }

    # Prefer the standalone site's assets, then fall back to Vite-built login assets.
    location /assets/ {
        try_files $uri @staff_assets;
    }

    location @staff_assets {
        root /srv/caregiver-system/frontend/dist;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
